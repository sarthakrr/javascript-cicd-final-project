
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.19
      script: |
        #!/bin/sh
        echo "Cleaning workspace..."
        rm -rf "$(workspaces.source.path)"/*
        echo "Cleanup completed successfully."

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-jest-tests
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Installing dependencies..."
        npm install
        echo "Running Jest unit tests..."
        npm test -- --runInBand
